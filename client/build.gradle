if (!rootProject.frameworkJar.isFile()) {
    throw new GradleException('请先构建 Framework，并指定 -PframeworkDir=/path/to/framework。')
}
dependencies {
    modImplementation files(rootProject.frameworkJar)
    modImplementation files(rootProject.frameworkServerJar)
    modImplementation project(':server')
    modImplementation 'io.wispforest:owo-lib:0.11.2+1.20'
    implementation 'org.tomlj:tomlj:1.1.1'
    include 'org.tomlj:tomlj:1.1.1'
    include 'org.antlr:antlr4-runtime:4.11.1'
}
sourceSets.create('smoke') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
// 两端验收模组必须登记相同物品清单，否则客户端连接专服时注册表同步失败。
processSmokeResources {
    from(rootProject.file('server/src/smoke/resources/bs3d')) { into 'bs3d' }
    from(rootProject.file('client/src/main/resources/bs3d/defaults/models/GrassPouch.bbmodel')) { into 'bs3d/models' }
}
// Loom 的外部 sourceSet 分组不自动加入 classpath，显式装入 common 才会执行注册入口。
sourceSets.main.runtimeClasspath += project(':server').sourceSets.main.output
sourceSets.smoke.runtimeClasspath += project(':server').sourceSets.main.output
// 单机和专服均装入同一 common 服务端产物，客户端不复制业务入口或 mixin。
loom {
    mods {
        // 本地开发运行也必须执行 common 的物品/方块注册，不能只把类放入 classpath。
        'backpack_storage_3d' { sourceSet project(':server').sourceSets.main }
        'backpack_storage_3d_client' { sourceSet sourceSets.main }
        'bs3d_smoke' { sourceSet sourceSets.smoke }
    }
    runs {
        client { runDir 'build/run' }
        smoke {
            client()
            source sourceSets.smoke
            runDir "../build/smoke/${project.rootProject.findProperty('smokeRun') ?: 'manual'}/client"
            property 'bs3d.smoke', 'true'
            programArgs '--username', 'VolumeSmoke', '--width', '1440', '--height', '960'
        }
        resourceSmoke {
            client()
            source sourceSets.smoke
            runDir "../build/smoke/${project.rootProject.findProperty('smokeRun') ?: 'manual'}/resource-client"
            property 'bs3d.resourcesSmoke', 'true'
            programArgs '--username', 'ResourceSmoke', '--width', '960', '--height', '640'
        }
    }
}
