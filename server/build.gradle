dependencies {
    // 与 client 相同，组合工程取 named 开发 JAR，避免 mod 重映射缓存滞后于上游源码。
    implementation('local.inventory-ui:server') { targetConfiguration = 'namedElements' }
    testImplementation libs.fabric.junit
}
test { systemProperty 'fabric.side', 'server' }
sourceSets.create('smoke') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
// 验收清单的自带模型复用带开合动画的默认模板，不在夹具目录保存第二份 bbmodel。
processSmokeResources {
    from(rootProject.file('client/src/main/resources/bs3d/defaults/models/GrassPouch.bbmodel')) { into 'bs3d/models' }
}
loom {
    mods {
        'backpack_storage_3d' { sourceSet sourceSets.main }
        'bs3d_smoke' { sourceSet sourceSets.smoke }
    }
    runs {
        server {
            runDir 'build/run'
            programArg 'nogui'
        }
        smoke {
            server()
            source sourceSets.smoke
            runDir "../build/smoke/${project.rootProject.findProperty('smokeRun') ?: 'manual'}/server"
            property 'bs3d.smoke', 'true'
            programArg 'nogui'
        }
    }
}
