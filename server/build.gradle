dependencies {
    // 与 client 相同，组合工程按坐标替换为源码工程，直接取其普通 JAR。
    implementation 'dev.kizuna.inventoryui:server'
    testImplementation libs.fabric.junit
}
test {
    systemProperty 'fabric.side', 'server'
    // 物品登记须在注册表冻结前、标签绑定须在冻结后，各测试类独占 JVM，互不改变对方的注册表状态。
    forkEvery = 1
}
sourceSets.create('smoke') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
// 验收清单的自带模型复用客户端单元测试里带开合动画的夹具，不在夹具目录保存第二份 bbmodel。
processSmokeResources {
    from(rootProject.file('client/src/test/resources/fixtures/LidPouch.bbmodel')) { into 'bs3d/models' }
}
loom {
    mods {
        'backpack_storage_3d' { sourceSet sourceSets.main }
        'bs3d_smoke' { sourceSet sourceSets.smoke }
    }
    runs {
        server {
            runDir 'build/run'
            programArg 'nogui'
        }
        smoke {
            server()
            source sourceSets.smoke
            runDir "../build/smoke/${project.rootProject.findProperty('smokeRun') ?: 'manual'}/server"
            property 'bs3d.smoke', 'true'
            programArg 'nogui'
        }
    }
}
