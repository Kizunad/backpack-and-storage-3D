plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

ext {
    // 公共 proto 只取 Inventory UI Framework 仓库的唯一源；其他布局通过 -Pkizuna.dir.inventory-ui 指定。
    frameworkDir = kizunaWorkspace.directory('inventory-ui')
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'com.google.protobuf'
    group = 'dev.kizuna.backpack3d'
    version = '0.1.0-SNAPSHOT'
    base.archivesName = "backpack-storage-3d-${project.name}"
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wispforest.io/releases' }
        // owo 0.13 依赖的 kdl4j 只发布在 JitPack。
        maven { url = 'https://jitpack.io' }
        mavenCentral()
    }
    java {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    dependencies {
        // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
        minecraft libs.minecraft
        implementation libs.fabric.loader
        implementation libs.fabric.api
        implementation libs.protobuf.java
        testImplementation libs.junit.jupiter
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    sourceSets.main {
        java.srcDir rootProject.file('shared/src/main/java')
        proto.srcDir rootProject.file('shared/src/main/proto')
    }
    protobuf {
        protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
        generateProtoTasks {
            all().configureEach { task ->
                // 两端公共生成类均由对应 Framework JAR 提供，只作为业务 proto 的 import。
                task.includeDirs.from(new File(rootProject.frameworkDir, 'src/main/proto'))
            }
            ofSourceSet('main').configureEach { task ->
                task.generateDescriptorSet = true
                task.descriptorSetOptions.path = layout.buildDirectory.file('descriptors/backpack-storage-3d-v1.desc').get().asFile.path
                task.descriptorSetOptions.includeImports = true
            }
        }
    }
    test { useJUnitPlatform() }
    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand version: project.version }
    }
    jar { from rootProject.file('LICENSE') }
}

tasks.named('build') { dependsOn ':client:build', ':server:build' }
tasks.named('check') { dependsOn ':client:check', ':server:check' }

// 协议包包含固定版本的公共 schema，方便独立语言实现服务端。
tasks.register('protocolZip', Zip) {
    dependsOn ':server:generateProto'
    archiveFileName = 'backpack-storage-3d-0.1.0-SNAPSHOT-proto.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('shared/src/main/proto')
    from(new File(frameworkDir, 'src/main/proto'))
    from(project(':server').layout.buildDirectory.file('descriptors/backpack-storage-3d-v1.desc')) { into 'descriptors' }
    from('LICENSE')
}
tasks.named('build') { dependsOn tasks.named('protocolZip') }
